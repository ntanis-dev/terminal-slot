name: CI
on:
  push:
    paths:
      - .npmrc
      - hot-scatter.js
      - index.js
      - LICENSE
      - ntanis.project.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**
      - THIRD-PARTY-NOTICES.md
      - .github/workflows/**
      - .github/CODEOWNERS
      - SECURITY.md
  pull_request:
    paths:
      - .npmrc
      - hot-scatter.js
      - index.js
      - LICENSE
      - ntanis.project.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**
      - THIRD-PARTY-NOTICES.md
      - .github/workflows/**
      - .github/CODEOWNERS
      - SECURITY.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ntanis-dev/ci/.github/workflows/project-validate.yml@b8e3a954214f0d3a180473937d0548619227232a
    with:
      project: terminal-slot
      build-script: release:build

