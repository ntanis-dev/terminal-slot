name: CI
on:
  push:
    paths:
      - .npmrc
      - hot-scatter.js
      - index.js
      - LICENSE
      - ntanis.project.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**
      - THIRD-PARTY-NOTICES.md
      - .github/workflows/**
      - .github/CODEOWNERS
      - renovate.json
      - SECURITY.md
  pull_request:
    paths:
      - .npmrc
      - hot-scatter.js
      - index.js
      - LICENSE
      - ntanis.project.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**
      - THIRD-PARTY-NOTICES.md
      - .github/workflows/**
      - .github/CODEOWNERS
      - renovate.json
      - SECURITY.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ntanis-dev/ci/.github/workflows/project-validate.yml@c254a68a09b9f71fe2def63c95f2cefacd1ad577
    with:
      project: terminal-slot
      build-script: release:build

